<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mines Adventure: Pro Edition</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&display=swap');

body {
    font-family: 'Inter', sans-serif;
    background: #f0f9ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.font-game { font-family: 'Bungee', cursive; }

.cartoon-card {
    background:white;
    border:4px solid #1e293b;
    border-radius:24px;
    box-shadow:8px 8px 0 #1e293b;
}

.btn-cartoon {
    background:#3b82f6;
    color:white;
    border:3px solid #1e293b;
    border-radius:12px;
    font-weight:bold;
    padding:12px;
    text-transform:uppercase;
}

.cell {
    width:32px;height:32px;
    border:2px solid #1e293b;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e2e8f0;
}

.cell.revealed { background:#f8fafc; }
.cell.mine { background:#ef4444;color:white; }

.overlay {
    position:fixed; inset:0;
    background:rgba(15,23,42,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
}

.overlay.active { opacity:1; pointer-events:auto; }
</style>

<script>
let onlinePlayers = {};

let state = {
    playerName:null,
    balance:500,
    titles:['Nováček'],
    activeTitle:'Nováček',
    isAdmin:false,
    board:[],
    gameOver:false,
    revealed:0,
    totalMines:0
};

function save(){
    if(!state.playerName) return;
    localStorage.setItem('player_'+state.playerName, JSON.stringify({
        balance:state.balance,
        titles:state.titles,
        activeTitle:state.activeTitle
    }));
}

function loadPlayer(name){
    const d = JSON.parse(localStorage.getItem('player_'+name));
    if(!d) return;
    state.balance=d.balance;
    state.titles=d.titles;
    state.activeTitle=d.activeTitle;
}

function loginPlayer(){
    const name=document.getElementById('player-name-input').value.trim();
    if(!name) return alert('Zadej jméno');
    state.playerName=name;
    state.isAdmin=(name==="HonzikAdmin");
    loadPlayer(name);
    updateUI();
    showScreen('setup');
}

function updateUI(){
    document.getElementById('balance').innerText=state.balance;
    document.getElementById('user-title').innerText=state.isAdmin?"ADMIN":state.activeTitle;
}

function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function startGame(m){
    state.totalMines=m;
    state.revealed=0;
    state.gameOver=false;

    state.board=[...Array(10)].map(()=>[...Array(10)].map(()=>({
        mine:Math.random()<m/100,
        rev:false
    })));

    onlinePlayers[state.playerName]={board:state.board};

    showScreen('game');
    const g=document.getElementById('grid');
    g.innerHTML='';

    for(let y=0;y<10;y++)for(let x=0;x<10;x++){
        const el=document.createElement('div');
        el.className='cell';
        el.onclick=()=>{
            if(state.gameOver) return;
            const c=state.board[y][x];
            if(c.rev) return;
            c.rev=true;
            if(c.mine){
                el.className='cell mine';
                el.innerHTML='💥';
                state.gameOver=true;
                alert('Prohra');
                showScreen('menu');
            }else{
                el.className='cell revealed';
                el.innerHTML='✓';
                state.revealed++;
                if(state.revealed>=100-state.totalMines) winGame();
            }
        }
        g.appendChild(el);
    }
}

function winGame(){
    const r=state.totalMines*10;
    state.balance+=r;
    save();
    alert('Výhra +'+r);
    showScreen('menu');
}

function toggleAdmin(){
    if(!state.isAdmin) return;
    document.getElementById('admin').classList.toggle('active');
    renderAdminPlayers();
}

function renderAdminPlayers(){
    const l=document.getElementById('admin-list');
    l.innerHTML='';
    Object.keys(onlinePlayers).forEach(n=>{
        l.innerHTML+=`<div class="text-white">${n}</div>`;
    });
}

window.addEventListener('keydown',e=>{
    if(e.key==='p' && state.isAdmin) toggleAdmin();
});
</script>
</head>

<body>

<!-- ADMIN -->
<div id="admin" class="overlay">
<div class="cartoon-card p-6 bg-slate-900 text-white">
<h2 class="font-game text-red-500 mb-4">ADMIN</h2>
<div id="admin-list"></div>
<button onclick="toggleAdmin()" class="btn-cartoon mt-4">Zavřít</button>
</div>
</div>

<!-- MENU -->
<div id="menu" class="screen cartoon-card p-8 text-center">
<div class="mb-2"><span id="user-title">Nováček</span></div>
<div class="mb-4"><i class="fas fa-coins"></i> <span id="balance">500</span></div>

<input id="player-name-input" placeholder="Tvé jméno"
class="border-4 border-slate-900 rounded-xl p-3 w-full mb-4 text-center font-bold">

<button onclick="loginPlayer()" class="btn-cartoon w-full mb-4">Hrát</button>
</div>

<!-- SETUP -->
<div id="setup" class="screen hidden cartoon-card p-8 text-center">
<button onclick="startGame(10)" class="btn-cartoon w-full mb-2">Pohoda</button>
<button onclick="startGame(25)" class="btn-cartoon w-full mb-2">Výzva</button>
<button onclick="startGame(45)" class="btn-cartoon w-full">Hardcore</button>
</div>

<!-- GAME -->
<div id="game" class="screen hidden cartoon-card p-6">
<div id="grid" class="grid grid-cols-10 gap-1"></div>
</div>

</body>
</html>
