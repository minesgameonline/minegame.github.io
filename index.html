<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Cartoon Online</title>
    <style>
        :root {
            --bg: #f0f7ff;
            --primary: #4a90e2;
            --secondary: #ffcc00;
            --danger: #ff4d4d;
            --success: #4cd137;
            --dark: #2f3640;
            --white: #ffffff;
            --admin: #e67e22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- UI CARTOON STYLE --- */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #3470b9;
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 5px;
            font-size: 1rem;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #3470b9;
        }

        .btn-orange { background: var(--admin); box-shadow: 0 4px 0 #d35400; }
        .btn-success { background: var(--success); box-shadow: 0 4px 0 #44bd32; }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin: 10px;
            text-align: center;
        }

        /* --- SCREEN MANAGEMENT --- */
        .screen { display: none; width: 90%; max-width: 800px; animation: fadeIn 0.3s; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- MINESWEEPER GRID --- */
        #game-grid {
            display: grid;
            gap: 5px;
            margin: 20px auto;
            background: #bdc3c7;
            padding: 10px;
            border-radius: 10px;
            user-select: none;
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: inset 0 -3px 0 #bdc3c7;
        }

        .cell.revealed { background: #fff; box-shadow: none; }
        .cell.mine { background: var(--danger); }
        .cell.flag { background: var(--secondary); }

        /* --- PLAYER INFO --- */
        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            margin: 10px 0;
            border: 3px solid var(--primary);
        }

        .title-tag {
            font-size: 0.8rem;
            display: block;
            color: var(--primary);
            font-weight: bold;
        }

        /* --- ADMIN MENU --- */
        #admin-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--admin);
            color: white;
            z-index: 1000;
            display: none;
            border: 5px solid white;
        }

        /* --- SHOP & CUP --- */
        .cup-banner {
            background: linear-gradient(45deg, #e67e22, #f1c40f);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin: 10px 0;
            border: 2px dashed white;
        }

    </style>
</head>
<body>

    <div id="screen-login" class="screen active panel">
        <h1>🎮 MineOnline</h1>
        <p>Zadej své jméno a vstup do světa min!</p>
        <input type="text" id="username-input" placeholder="Tvé jméno..." style="padding: 10px; border-radius: 10px; border: 2px solid #ddd; width: 80%;">
        <br><br>
        <button class="btn" onclick="login()">Vstoupit do hry</button>
    </div>

    <div id="screen-menu" class="screen panel">
        <div class="player-card">
            <div>
                <span id="display-name" style="font-size: 1.2rem; font-weight: bold;"></span>
                <span id="display-title" class="title-tag">Nováček</span>
            </div>
            <div>
                💰 <span id="display-money">0</span> | 🏆 ELO: <span id="display-elo">1000</span>
            </div>
        </div>

        <div class="cup-banner">
            <h3>🟠 OG CUP PRÁVĚ PROBÍHÁ!</h3>
            <p>Vyhraj 3 hry v řadě a získej titul "OG Player"!</p>
        </div>

        <button class="btn" onclick="startGame('easy')">Lehká (8x8)</button>
        <button class="btn" onclick="startGame('medium')">Střední (12x12)</button>
        <button class="btn" onclick="startGame('hard')">Těžká (16x16)</button>
        <hr>
        <button class="btn btn-orange" onclick="showScreen('screen-shop')">🛒 Obchod</button>
        <button class="btn btn-orange" onclick="showScreen('screen-leaderboard')">🏅 Leaderboard</button>
    </div>

    <div id="screen-game" class="screen panel">
        <div id="game-info">
            Miny: <span id="mine-count">0</span> | Čas: <span id="timer">0</span>s
        </div>
        <div id="game-grid"></div>
        <button class="btn" onclick="showScreen('screen-menu')">Zpět do menu</button>
    </div>

    <div id="screen-shop" class="screen panel">
        <h2>🛒 Obchod</h2>
        <div id="shop-items">
            <div class="panel">
                <h4>Titul: Mine Master</h4>
                <p>Cena: 500 💰</p>
                <button class="btn" onclick="buyTitle('Mine Master', 500)">Koupit</button>
            </div>
            <div class="panel">
                <h4>Titul: Pro Player</h4>
                <p>Cena: 1000 💰</p>
                <button class="btn" onclick="buyTitle('Pro Player', 1000)">Koupit</button>
            </div>
        </div>
        <button class="btn" onclick="showScreen('screen-menu')">Zpět</button>
    </div>

    <div id="screen-leaderboard" class="screen panel">
        <h2>🏅 Globální Leaderboard</h2>
        <table style="width: 100%;" id="leaderboard-table">
            </table>
        <br>
        <button class="btn" onclick="showScreen('screen-menu')">Zpět</button>
    </div>

    <div id="admin-menu" class="panel">
        <h2 style="color: white;">🛠 ADMIN PANEL</h2>
        <button class="btn" onclick="adminWin()">Instant Win ✅</button>
        <button class="btn" onclick="alert('Sleduješ hráče Hráč123...')">Spectate 👀</button>
        <button class="btn" onclick="addMoneyAdmin()">Přidat 1000 💰</button>
        <button class="btn" onclick="alert('Hráč byl zabanován!')">Ban Hráče 🔨</button>
        <br><br>
        <button class="btn" onclick="document.getElementById('admin-menu').style.display='none'">Zavřít (Esc)</button>
    </div>

    <script>
        // --- DATA & STAV ---
        let player = {
            name: "",
            money: 0,
            title: "Hráč",
            elo: 1000,
            isAdmin: false,
            isBanned: false
        };

        let game = {
            grid: [],
            rows: 0,
            cols: 0,
            mines: 0,
            revealed: 0,
            active: false
        };

        // --- INICIALIZACE ---
        window.onload = () => {
            if(localStorage.getItem('minesweeper_player')) {
                player = JSON.parse(localStorage.getItem('minesweeper_player'));
                updateUI();
            }
        };

        function save() {
            localStorage.setItem('minesweeper_player', JSON.stringify(player));
        }

        function login() {
            const name = document.getElementById('username-input').value;
            if(!name) return alert("Zadej jméno!");
            
            player.name = name;
            if(name === "HonzikAdmin") {
                player.isAdmin = true;
                alert("Vítej Admine! Menu otevřeš klávesou 'P'.");
            }
            
            updateUI();
            showScreen('screen-menu');
            save();
        }

        function updateUI() {
            document.getElementById('display-name').innerText = player.name;
            document.getElementById('display-title').innerText = player.title;
            document.getElementById('display-money').innerText = player.money;
            document.getElementById('display-elo').innerText = player.elo;
            renderLeaderboard();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- LOGIKA MINESWEEPER ---
        function startGame(difficulty) {
            const config = {
                easy: { r: 8, c: 8, m: 10 },
                medium: { r: 12, c: 12, m: 20 },
                hard: { r: 16, c: 16, m: 40 }
            };
            const c = config[difficulty];
            game.rows = c.r; game.cols = c.c; game.mines = c.m;
            game.revealed = 0;
            game.active = true;
            
            initGrid();
            showScreen('screen-game');
        }

        function initGrid() {
            const gridEl = document.getElementById('game-grid');
            gridEl.style.gridTemplateColumns = `repeat(${game.cols}, 40px)`;
            gridEl.innerHTML = '';
            game.grid = [];

            // Vytvoření pole
            for(let r=0; r<game.rows; r++) {
                game.grid[r] = [];
                for(let c=0; c<game.cols; c++) {
                    const el = document.createElement('div');
                    el.classList.add('cell');
                    el.onclick = () => reveal(r, c);
                    el.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
                    gridEl.appendChild(el);
                    game.grid[r][c] = { mine: false, revealed: false, flagged: false, count: 0, el: el };
                }
            }

            // Rozmístění min
            let placed = 0;
            while(placed < game.mines) {
                let rr = Math.floor(Math.random()*game.rows);
                let rc = Math.floor(Math.random()*game.cols);
                if(!game.grid[rr][rc].mine) {
                    game.grid[rr][rc].mine = true;
                    placed++;
                }
            }

            // Výpočet sousedů
            for(let r=0; r<game.rows; r++) {
                for(let c=0; c<game.cols; c++) {
                    if(game.grid[r][c].mine) continue;
                    let count = 0;
                    for(let i=-1; i<=1; i++) {
                        for(let j=-1; j<=1; j++) {
                            if(game.grid[r+i] && game.grid[r+i][c+j] && game.grid[r+i][c+j].mine) count++;
                        }
                    }
                    game.grid[r][c].count = count;
                }
            }
            document.getElementById('mine-count').innerText = game.mines;
        }

        function reveal(r, c) {
            if(!game.active || game.grid[r][c].revealed || game.grid[r][c].flagged) return;
            
            const cell = game.grid[r][c];
            cell.revealed = true;
            cell.el.classList.add('revealed');

            if(cell.mine) {
                gameOver(false);
                return;
            }

            if(cell.count > 0) {
                cell.el.innerText = cell.count;
            } else {
                // Rekurze pro prázdná políčka
                for(let i=-1; i<=1; i++) {
                    for(let j=-1; j<=1; j++) {
                        if(game.grid[r+i] && game.grid[r+i][c+j]) reveal(r+i, c+j);
                    }
                }
            }

            game.revealed++;
            if(game.revealed === (game.rows * game.cols) - game.mines) gameOver(true);
        }

        function toggleFlag(r, c) {
            const cell = game.grid[r][c];
            if(cell.revealed) return;
            cell.flagged = !cell.flagged;
            cell.el.innerText = cell.flagged ? '🚩' : '';
        }

        function gameOver(win) {
            game.active = false;
            if(win) {
                const reward = 50;
                player.money += reward;
                player.elo += 25;
                alert(`Vítězství! Získal jsi ${reward} 💰 a 25 ELO.`);
            } else {
                player.elo = Math.max(0, player.elo - 15);
                alert("BUM! Prohrál jsi.");
            }
            updateUI();
            save();
            showScreen('screen-menu');
        }

        // --- SHOP ---
        function buyTitle(name, price) {
            if(player.money >= price) {
                player.money -= price;
                player.title = name;
                alert(`Koupeno: ${name}`);
                updateUI();
                save();
            } else {
                alert("Nedostatek peněz!");
            }
        }

        // --- SIMULOVANÝ LEADERBOARD ---
        function renderLeaderboard() {
            const table = document.getElementById('leaderboard-table');
            const fakePlayers = [
                {name: "MineMaster99", el: 2100, t: "Legend"},
                {name: "Pepa_Z_Depa", el: 1850, t: "Pro Player"},
                {name: player.name, el: player.elo, t: player.title},
                {name: "Anicka_05", el: 950, t: "Nováček"}
            ].sort((a,b) => b.el - a.el);

            table.innerHTML = "<tr><th>Hráč</th><th>Titul</th><th>ELO</th></tr>";
            fakePlayers.forEach(p => {
                table.innerHTML += `<tr><td>${p.name}</td><td>${p.t}</td><td>${p.el}</td></tr>`;
            });
        }

        // --- ADMIN FUNKCE ---
        window.onkeydown = (e) => {
            if(e.key.toLowerCase() === 'p' && player.isAdmin) {
                const menu = document.getElementById('admin-menu');
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            }
        };

        function adminWin() {
            if(game.active) gameOver(true);
            document.getElementById('admin-menu').style.display = 'none';
        }

        function addMoneyAdmin() {
            player.money += 1000;
            updateUI();
            save();
            alert("Peníze přidány!");
        }

    </script>
</body>
</html>
